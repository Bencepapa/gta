# Publish the game to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The game is static files: just the page and its modules.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
          # vehicle atlases + their annotations (from tools/atlas-editor.html)
          mkdir _site/concept
          cp concept/*.webp concept/*.json _site/concept/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
